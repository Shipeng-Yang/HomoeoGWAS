name: Ensure GitHub Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish tagged version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
            tag="v${version}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "No ${tag} tag exists yet; skipping GitHub Release creation."
          fi

      - name: Create GitHub Release if missing
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          notes_file="docs/releases/${RELEASE_TAG}.md"

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [[ -f "${notes_file}" ]]; then
              gh release edit "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "HomoeoGWAS ${RELEASE_TAG}" \
                --notes-file "${notes_file}"
              echo "Updated GitHub Release ${RELEASE_TAG} from ${notes_file}."
            else
              echo "GitHub Release ${RELEASE_TAG} already exists; nothing to do."
            fi
            exit 0
          fi

          if [[ -f "${notes_file}" ]]; then
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "HomoeoGWAS ${RELEASE_TAG}" \
              --notes-file "${notes_file}"
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "HomoeoGWAS ${RELEASE_TAG}" \
              --generate-notes
          fi
