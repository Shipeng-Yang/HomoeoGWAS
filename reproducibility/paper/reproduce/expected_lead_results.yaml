# Wheat Scan T is a TRIAD scan: each group contributes K=C(3,2)=3 pairwise tests, so the
# authoritative pairwise threshold is 0.05/(G*K) and the pre-specified primary unit is the
# per-triad ACAT omnibus at 0.05/G. Engine versions through 1.0.2 emitted 0.05/G per contrast.
# statistic MUST be `burden`; the package default omniB is a different estimand.
wheat_watkins_scanT:
  panel: {n: 827, G: 12768, n_sub: 3}
  days_to_emerg:
    config: reproducibility/paper/configs/runs/interact_wheat_watkins_gw_scanT.yaml
    transform: INT
    statistic: burden
    families:
      pairwise_all: {n_tests: 38304, per_test_alpha: 1.3053467000835422e-06}
      group_omnibus: {n_tests: 12768, per_test_alpha: 3.9160401002506265e-06}
      contrast_omnibus: {n_tests: 3, per_test_alpha: 0.016666666666666666}
    estimability:
      n_planned: 38304
      n_valid: 38295
      n_unestimable: 9
      by_contrast: {AB: 0, AD: 4, BD: 5}
    group_omnibus:
      top_triad: [TraesCS5A02G169500, TraesCS5B02G166300, TraesCS5D02G173900]
      min_p: 9.620491597250869e-07
      min_p_adjusted_bonferroni: 0.012283443671369909
      n_sig: 1
      n_partial: 9
    pairwise:
      AB:
        top_triad: [TraesCS1A02G060500, TraesCS1B02G078800, TraesCS1D02G061400]
        min_p: 2.4807769061029786e-05
        lambda_gc_obs: 1.0048962927483125
        acat: 0.3997380407229038
        n_sig: 0
      AD:
        top_triad: [TraesCS5A02G169500, TraesCS5B02G166300, TraesCS5D02G173900]
        min_p: 3.20683403476995e-07
        lambda_gc_obs: 0.9820440138972879
        acat: 0.004118353108155837
        acat_adjusted_bonferroni: 0.01235505932446751
        n_sig: 1
      BD:
        top_triad: [TraesCS1A02G125400, TraesCS1B02G143800, TraesCS1D02G128400]
        min_p: 2.418077400917113e-06
        lambda_gc_obs: 1.027185613479071
        acat: 0.02840356588218207
        acat_adjusted_bonferroni: 0.08521069764654621
        n_sig: 0
    triad_acat_omnibus: 0.010754347492272831
    sigma_hat: {A: 0.0685962226486131, B: 0.3859931828441825, D: 0.03882062084750674, e: 0.3916912414499855}
    tolerance:
      relative: 1.0e-4
      note: >-
        the burden cap RNG stream is consumed per triad by the engine and per subgenome by the
        paper script, so p-values agree to ~1e-5 relative rather than bitwise; the estimability
        mask, the rejection sets and every threshold are exact
    manuscript_cross_check:
      chr1_BD_paper_value: 2.418077841738446e-06
      chr5_AD_paper_value: 3.206788930434788e-07
      note: >-
        chr5 A-D is the only genome-wide significant wheat interaction under either self-consistent
        unit; chr1 B-D is a candidate (correlation-aware max-T adjusted P=0.078, Bonferroni 0.093)
