# Genome-wide wheat homoeolog-triad burden-product scan (Scan T, the manuscript's wheat scan).
# statistic MUST be set explicitly: the package default is omniB, which is a different estimand.
# Inputs are regenerated by reproducibility/paper/scripts/phase7/bio_wheat/prep_wheat_gw_interact.py
# and results/phase7/wheat_multiplicity_2026-07-23/scripts/build_wheat_cli_inputs.py.
interact:
  mode: triad
  subgenomes: [A, B, D]
  statistic: burden
  primary_weighting: unweighted
  genotype:
    A: data/processed/wheat/scanT/gw_A_flank
    B: data/processed/wheat/scanT/gw_B_flank
    D: data/processed/wheat/scanT/gw_D_flank
  snp_to_gene:
    A: data/processed/wheat/scanT/snp_to_gene_A.npz
    B: data/processed/wheat/scanT/snp_to_gene_B.npz
    D: data/processed/wheat/scanT/snp_to_gene_D.npz
  triads: data/processed/wheat/scanT/triads_gw.tsv
  phenotype: data/processed/wheat/pheno_clean.tsv
  sample_col: sample
  trait: days_to_emerg
  burden: {cap: 150, min_snp: 3}
  grm: {method: grm_from_X}
  calibration: {method: permutation, perm_B: 0}
outputs:
  out_dir: results/paper_leads/wheat_watkins_scanT/days_to_emerg
  plots: false
