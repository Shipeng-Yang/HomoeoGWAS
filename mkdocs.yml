site_name: HomoeoGWAS
site_description: Subgenome-aware trait architecture and homoeolog-interaction analysis for allopolyploid crops
site_url: https://shipeng-yang.github.io/HomoeoGWAS/
repo_url: https://github.com/Shipeng-Yang/HomoeoGWAS
repo_name: Shipeng-Yang/HomoeoGWAS

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: green
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Inputs & Outputs: io.md
  - Interaction Inputs: interact_inputs.md
  - Follow-up: followup.md
  - Run Registry: run_registry.md
  - Data-owner Waivers: data_owner_waivers.md
  - Examples:
      - Strawberry Octoploid: examples/strawberry_octoploid.md
  - Algorithm: algorithm.md
  - API Reference: api.md
  - Release Notes:
      - v2.2.0: releases/v2.2.0.md
      - v2.1.4: releases/v2.1.4.md
      - v2.1.3: releases/v2.1.3.md
      - v2.1.2: releases/v2.1.2.md
      - v2.1.1: releases/v2.1.1.md
      - v2.1.0: releases/v2.1.0.md
      - v2.0.1: releases/v2.0.1.md

docs_dir: docs

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

extra:
  generator: false
